<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ecdcb4">
<title>Abordage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout : une carte au trésor pleine page (parchemin, mer teal, encre brune), puis la grille de chasse sur la même mer. Un seul thème. */
:root{
  --parch:#ecdcb4; --parch2:#f4e8c8; --parch3:#dcc593; --sea:#8dbdb8; --sea2:#6fa8a3; --sea3:#b6d6d1; --ink:#4b3220; --ink2:#2b1d12; --inkl:#7a5b3e;
  --red:#c6472f; --brass:#c99a3d; --fire:#e8712d; --wood:#6b4426;
  --fd:"Pirata One","Georgia",serif; --f:"Nunito",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100%;margin:0;overflow:hidden;background:var(--parch);color:var(--ink);font-family:var(--f);font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.35),transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(120,80,30,.14),transparent 55%),
  repeating-linear-gradient(0deg,transparent 0 3px,rgba(90,60,20,.025) 3px 4px)}
.app{position:relative;z-index:1;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.scr{height:100%;display:flex;flex-direction:column;gap:8px}

/* barre */
.top{display:flex;align-items:center;gap:8px;height:46px;flex:none}
.top h1{font:400 1.9rem/1 var(--fd);margin:0;letter-spacing:.02em;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font:800 .68rem var(--f);color:var(--inkl);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.pill{display:flex;align-items:center;gap:5px;background:var(--ink2);color:var(--parch2);border-radius:999px;padding:5px 11px 5px 7px;font:800 .9rem var(--f);font-variant-numeric:tabular-nums;transition:transform .12s}
.pill.bump{transform:scale(1.12)}
.coin{width:15px;height:15px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 2px #8f6a22;display:block;flex:none}
.ic{width:36px;height:36px;border:0;border-radius:50%;background:none;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--ink)}
.ic svg{width:21px;height:21px}.ic.off{opacity:.3}

/* recherchés */
.wanted{display:flex;gap:8px;flex:none}
.wp{flex:1;display:flex;align-items:center;gap:7px;background:var(--parch2);border:1.5px solid var(--inkl);border-radius:10px;padding:5px 7px;min-width:0;position:relative}
.wp .face{width:28px;height:28px;flex:none}
.wp b{display:block;font:400 .82rem/1 var(--fd);color:var(--ink2);white-space:normal;line-height:.95}
.wp span{display:none}
.wp.got{border-color:var(--red)}
.wp.got::after{content:"";position:absolute;right:6px;top:6px;width:14px;height:14px;background:
  linear-gradient(45deg,transparent 42%,var(--red) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--red) 42% 58%,transparent 58%)}
.wp .frag{position:absolute;right:5px;bottom:4px;font:400 .72rem var(--fd);color:var(--red)}

/* carte */
.map{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;background:var(--sea);
  box-shadow:inset 0 0 0 3px var(--parch3),inset 0 0 0 5px var(--inkl),0 10px 30px -14px rgba(60,40,10,.6)}
.map svg.base{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:21%;max-width:96px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;z-index:2}
.node svg{width:100%;height:auto;display:block}
.node .nm{font:400 .74rem/1 var(--fd);color:var(--ink2);white-space:nowrap;text-shadow:0 0 4px var(--parch),0 0 6px var(--parch)}
.node:disabled{cursor:default}
.node.far{opacity:.55}
.node.sel{z-index:3}
.node.sel::before{content:"";position:absolute;left:50%;top:46%;width:108%;aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--red);transform:translate(-50%,-50%);animation:spin 16s linear infinite}
.node.done .nm{text-decoration:line-through;opacity:.7}
.node.treasure svg{animation:bob 2.4s ease-in-out infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-5%)}}
.ship-tok{position:absolute;width:11%;max-width:52px;z-index:4;pointer-events:none;transform:translate(-50%,-60%);transition:left 1.1s cubic-bezier(.45,0,.3,1),top 1.1s cubic-bezier(.45,0,.3,1)}
.ship-tok svg{width:100%;display:block;filter:drop-shadow(0 2px 1px rgba(40,25,5,.35))}
.compass{position:absolute;right:8px;top:8px;width:46px;z-index:3;opacity:.85;pointer-events:none}
.panel{flex:none;display:flex;align-items:center;gap:10px;background:var(--parch2);border:1.5px solid var(--inkl);border-radius:14px;padding:8px 8px 8px 10px;min-height:70px}
.panel .pic{width:50px;height:50px;flex:none}
.panel .pic svg{width:100%;height:100%}
.panel .txt{flex:1;min-width:0}
.panel small{display:block;font:800 .6rem var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--inkl)}
.panel b{display:block;font:400 1.15rem/1.05 var(--fd);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel span{display:block;font:600 .76rem/1.3 var(--f);color:var(--ink)}
.go{flex:none;height:50px;padding:0 16px;border:0;border-radius:12px;background:var(--ink2);color:var(--parch2);font:400 1.1rem var(--fd);letter-spacing:.03em;cursor:pointer;transition:transform .1s;display:flex;align-items:center;gap:7px}
.go:active{transform:scale(.95)}
.go.red{background:var(--red)}
.go svg{width:20px;height:20px}
.go:disabled{opacity:.4}

/* chasse */
.hud{display:flex;align-items:center;gap:8px;height:30px;flex:none}
.fleet{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sh{height:14px;width:auto;fill:none;stroke:var(--ink);stroke-width:1.6;transition:all .3s}
.sh.x{fill:var(--ink);opacity:.35}
.sh.cap{stroke:var(--red)}
.lives{display:flex;gap:5px}
.ammo{display:flex;align-items:center;gap:5px;color:var(--ink2);font:400 1.25rem var(--fd)}
.ammo small{font:800 .62rem var(--f);color:var(--inkl);letter-spacing:.04em;text-transform:uppercase}
.ammo.warn b{color:var(--fire)}.ammo.red{color:var(--red)}.ammo.red b,.ammo.red small{color:var(--red)}.ammo.red svg{animation:readyp .5s infinite}
.life{width:18px;height:18px;fill:var(--red);transition:transform .25s}
.life.x{fill:none;stroke:var(--inkl);stroke-width:1.6;transform:scale(.85)}
.items{display:flex;gap:6px}
.item{height:28px;border:1.5px solid var(--inkl);background:var(--parch2);border-radius:999px;padding:0 9px 0 6px;display:flex;align-items:center;gap:4px;font:800 .78rem var(--f);cursor:pointer}
.item svg{width:16px;height:16px}
.item:disabled{opacity:.35}
.stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.board{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);border-radius:12px;overflow:hidden;background:var(--sea);container-type:inline-size;
  box-shadow:inset 0 0 0 3px var(--parch3),inset 0 0 0 5px var(--inkl)}
.board.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.waves{position:absolute;inset:0;pointer-events:none}
.rip{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grid{position:relative;z-index:1;display:grid;width:100%;height:100%;padding:6px;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:3px}
.c{position:relative;border:0;padding:0;margin:0;border-radius:9%;display:grid;place-items:center;cursor:pointer;color:var(--ink2);background:transparent;
  box-shadow:inset 0 0 0 1px rgba(60,40,10,.18);font:400 calc(100cqw / var(--n) * .6)/1 var(--fd);transition:transform .1s,background-color .3s;
  --amp:-4px;animation:swell 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes swell{0%,100%{translate:0 0}50%{translate:0 var(--amp)}}
.c.w,.c.s{--amp:-1.5px}
.ship{animation:swell 3.6s ease-in-out infinite;animation-delay:var(--d,0s);--amp:-3px}
.puff{position:fixed;z-index:58;border-radius:50%;background:radial-gradient(circle,rgba(120,100,80,.85),rgba(120,100,80,0) 70%);pointer-events:none}
.voy{display:flex;align-items:center;gap:0;height:26px;flex:none;padding:0 2px}
.voy i{flex:1;height:2px;background:var(--inkl);opacity:.5}
.voy span{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--inkl);background:var(--parch2);display:grid;place-items:center;color:var(--inkl);flex:none}
.voy span svg{width:13px;height:13px}
.voy span.cur{width:28px;height:28px;background:var(--ink2);border-color:var(--ink2);color:var(--parch2);box-shadow:0 0 0 3px var(--parch),0 0 0 4.5px var(--inkl)}
.voy span.cur svg{width:16px;height:16px}
.voy span.done{background:var(--inkl);color:var(--parch2)}
.voy span.cap{border-color:var(--red);color:var(--red)}.voy span.cap.cur{background:var(--red);border-color:var(--red);color:var(--parch2)}
.voy span.tres{border-color:var(--red);color:var(--red);border-style:dashed}
.c.p{transform:scale(.88);background:rgba(255,255,255,.25)}
.c.tw{background:rgba(255,255,255,.15)!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.c.w{background:var(--parch2);box-shadow:inset 0 0 0 1.5px var(--inkl);cursor:default}
.c.w.z{background:var(--parch)}
.c.w.z::after{content:"";width:18%;height:18%;border-radius:50%;background:var(--parch3)}
.n1{color:var(--ink)}.n2{color:var(--red)}.n3{color:#1f5e5a}.n4{color:#5a2d8a}
.c.h{background:var(--parch2);box-shadow:inset 0 0 0 2px var(--red);cursor:default}
.c.h::after{content:"";position:absolute;inset:0;background:rgba(232,113,45,.18)}
.c.s{background:var(--sea2);box-shadow:inset 0 0 0 1px rgba(60,40,10,.25);cursor:default}
.c.s::after{content:"";position:absolute;inset:8%;background:var(--debris) center/100% no-repeat}
.c.g{box-shadow:inset 0 0 0 2px var(--red)}
.c.r{background:var(--parch2);box-shadow:inset 0 0 0 2px var(--ink2);cursor:pointer}
.c.r::after{content:"";position:absolute;inset:16%;background:var(--hull) center/100% no-repeat}
.c.f::after{content:"";position:absolute;inset:22%;background:var(--flag) center/100% no-repeat}
.fl{position:absolute;inset:0;padding:6px;pointer-events:none;z-index:2}
.ship{position:absolute;border-radius:6%}
.piece{position:absolute;overflow:hidden;border-radius:9%;pointer-events:none;animation:swell 3.6s ease-in-out infinite;animation-delay:var(--d,0s);--amp:-3px}
.piece svg{position:absolute}
.piece .rip{position:absolute;inset:4%;border-radius:50%;background:conic-gradient(var(--red) calc(var(--k,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);opacity:.95;z-index:2}
.piece .rip.hot{animation:readyp .35s infinite}
.piece::after{content:"";position:absolute;inset:14% 30% 34%;background:var(--flame) center/100% no-repeat;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.12) translateY(-4%)}}
.ship svg{position:absolute;inset:0;width:100%;height:100%}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.banner span{background:var(--parch2);color:var(--ink2);font:400 1.6rem var(--fd);padding:8px 22px;border-radius:8px;border:2px solid var(--ink);opacity:0;box-shadow:0 4px 0 var(--inkl)}
.banner span.r{background:var(--red);color:var(--parch2);border-color:var(--red);box-shadow:0 4px 0 #8a2e1c}
.banner span.go{animation:ban 1.1s cubic-bezier(.3,1.5,.5,1)}
@keyframes ban{0%{opacity:0;transform:scale(.6) rotate(-4deg)}18%{opacity:1;transform:scale(1) rotate(-2deg)}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.msg{height:22px;flex:none;text-align:center;font:400 1.1rem/22px var(--fd);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.msg.bad{color:var(--red)}.msg.good{color:#1f5e5a}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:58px;flex:none}
.mode{border:2px solid var(--ink2);border-radius:14px;background:var(--parch2);color:var(--ink2);font:400 1.25rem var(--fd);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:transform .1s,background .2s,color .2s}
.mode svg{width:24px;height:24px}
.mode:active{transform:scale(.96)}
.mode[aria-pressed="true"]{background:var(--ink2);color:var(--parch2)}
#mFire[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
#mBordee{border-color:var(--brass);background:#f7e6b8;box-shadow:0 0 0 3px rgba(201,154,61,.45),0 0 18px rgba(232,113,45,.6);animation:readyp .9s ease-in-out infinite}
#mBordee[aria-pressed="true"]{background:#e8712d;color:#fff6c0;border-color:#e8712d}
#mBordee[hidden]{display:none}
.ctrl:has(#mBordee:not([hidden])){grid-template-columns:1fr 1fr 1.15fr}
.ctrl:has(#mBordee:not([hidden])) .mode{font-size:1.05rem;gap:6px}
.mode{position:relative;overflow:hidden}
.c.aim{outline:2px solid #e8712d;outline-offset:-2px}
.bdg{display:grid;grid-template-columns:repeat(5,26px);gap:3px;justify-content:center;margin:10px auto 6px}
.bdg i{width:26px;height:26px;border-radius:5px;background:var(--parch3);border:1px solid rgba(60,40,10,.25)}
.bdg i.x{background:#e8712d;border-color:#c25a1c}.bdg i.t{background:#fff6c0;border-color:#e8712d;box-shadow:0 0 0 2px #e8712d inset}
@keyframes readyp{50%{transform:scale(1.04);box-shadow:0 0 0 5px rgba(201,154,61,.6),0 0 28px rgba(232,113,45,.8)}}
.furie{position:absolute;left:8px;right:8px;bottom:4px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);overflow:hidden}
.furie i{display:block;height:100%;background:var(--brass);transform-origin:left;transition:transform .25s}
.fuse{position:relative;height:18px;flex:none;display:flex;align-items:center;gap:8px}
.fuse .lbl{font:400 .85rem var(--fd);color:var(--ink2);white-space:nowrap;letter-spacing:.03em}
.fuse .meche{flex:1;height:8px;border-radius:4px;background:repeating-linear-gradient(135deg,#8a5a36 0 5px,#6b4426 5px 10px);position:relative;overflow:visible}
.fuse .burnt{position:absolute;right:0;width:0;top:0;bottom:0;background:var(--parch);opacity:.9;border-radius:0 4px 4px 0}
.fuse .spark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff6c0 0 25%,#e8712d 55%,transparent 72%);animation:sparkle .25s ease-in-out infinite alternate}
@keyframes sparkle{to{transform:scale(1.35);filter:brightness(1.2)}}
.fuse.low .lbl{color:var(--red);animation:readyp .5s infinite}
.vol{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,transparent 40%,rgba(198,71,47,.55));opacity:0}
.cross{position:absolute;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent,#fff6c0,transparent);opacity:.9}
.ball{position:fixed;z-index:60;width:14px;height:14px;border-radius:50%;background:var(--ink2);pointer-events:none;box-shadow:inset -3px -3px 0 rgba(255,255,255,.18)}
.flash{position:fixed;z-index:61;width:60px;height:60px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff3b0 0 20%,#e8712d 45%,transparent 70%)}
/* pillage */
.pil{position:relative;width:100%;height:240px;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(90deg,#8a5a36 0 22px,#7a4b2b 22px 24px),#8a5a36;box-shadow:inset 0 0 0 3px var(--ink2)}
.pil::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 60px,rgba(0,0,0,.12) 60px 62px)}
.pil .deck{position:absolute;left:8%;right:8%;top:8px;height:24px;border-radius:12px;background:var(--parch);box-shadow:inset 0 0 0 2px var(--ink2);display:flex;align-items:center;justify-content:center;gap:10px;font:400 1rem var(--fd);color:var(--ink2);z-index:3}
.pil .tb{position:absolute;left:8%;right:8%;bottom:8px;height:12px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;z-index:3}
.pil .tb i{display:block;height:100%;background:var(--brass);transform-origin:left}
.lt{position:absolute;width:58px;height:58px;border:0;border-radius:50%;background:var(--parch2);box-shadow:0 0 0 3px var(--ink2),0 4px 0 3px rgba(0,0,0,.25);display:grid;place-items:center;padding:0;cursor:pointer;z-index:2;transform:translate(-50%,-50%) scale(0);animation:ltin .18s cubic-bezier(.3,1.6,.5,1) forwards,ltup 1.25s .18s ease-in forwards}
.lt svg{width:30px;height:30px;color:var(--ink2)}
.lt.gold{background:var(--brass)}.lt.gold svg{color:#5a3f10}
.lt.rum{background:#d9a066}.lt.pow{background:#9c9c9c}.lt.spy{background:#b6d6d1}.lt.crew{background:#e7c7b3}
.lt b{position:absolute;bottom:-14px;font:400 .8rem var(--fd);color:var(--parch2);text-shadow:0 1px 0 var(--ink2),0 0 4px var(--ink2)}
@keyframes ltin{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes ltup{0%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-80%) scale(1);opacity:1}100%{transform:translate(-50%,-100%) scale(.6);opacity:0}}
.lt.got{animation:ltgot .22s ease-out forwards}
@keyframes ltgot{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.pilsum{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font:400 1.05rem var(--fd)}
.pilsum span{display:flex;align-items:center;gap:4px;background:var(--parch);border:1.5px solid var(--inkl);border-radius:999px;padding:4px 10px}
.pilsum svg{width:18px;height:18px}
.boarding,.rope,.crew,.bang,.loot,.lc{display:none}
.smoke{position:fixed;z-index:59;width:28px;height:28px;border-radius:50%;background:rgba(240,228,200,.9);pointer-events:none}

/* feuilles parchemin */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(70,45,20,.55);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px)+20px) 16px calc(env(safe-area-inset-bottom,0px)+16px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{width:100%;max-width:370px;max-height:100%;overflow:auto;background:var(--parch2);border:2px solid var(--ink);border-radius:6px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;animation:rise .3s cubic-bezier(.3,1.4,.5,1);
  box-shadow:0 0 0 6px var(--parch),0 0 0 7px var(--inkl),0 20px 40px -10px rgba(40,25,5,.6)}
.card>*{flex-shrink:0}
@keyframes rise{0%{transform:translateY(20px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.kick{font:800 .68rem var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.card h2{font:400 2rem/1 var(--fd);margin:0;color:var(--ink2);text-wrap:balance}
.card p{margin:0;font:600 .93rem/1.4 var(--f);color:var(--ink);max-width:30ch}
.card p.sm{font-size:.8rem;color:var(--inkl)}
.big{width:92px;height:92px}
.btns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:4px}
.cta{height:52px;border:0;border-radius:12px;background:var(--ink2);color:var(--parch2);font:400 1.2rem var(--fd);letter-spacing:.03em;cursor:pointer;transition:transform .1s}
.cta:active{transform:scale(.96)}

    const list=[];s.cells.forEach(([y,x])=>nb(y,x).forEach(([yy,xx])=>{if(board[yy][xx]===-1)revealWater(yy,xx,list)}));revealAnim(list.map(([y,x])=>[y,x,1]),40);hud();
    later(()=>banner(s.kraken?"Le Kraken sombre !":"Coulé !","r"),500);
    later(()=>{if(s.isCap)captainDuel(s);else{over=false;checkWin()}},s.isCap?1300:550)},300);
  say(s.name+" explose !","good")}
function layShip(o){const s=o.s,f=s.cells[0],e=s.cells[s.cells.length-1],a=cells[f[0]*N+f[1]],b=cells[e[0]*N+e[1]];o.el.style.left=a.offsetLeft+"px";o.el.style.top=a.offsetTop+"px";o.el.style.width=(b.offsetLeft+b.offsetWidth-a.offsetLeft)+"px";o.el.style.height=(b.offsetTop+b.offsetHeight-a.offsetTop)+"px"}
function addShip(s){const v=s.cells.length>1&&s.cells[0][1]===s.cells[1][1],L=s.cells.length,el=document.createElement("div");el.className="ship";el.style.setProperty("--d",(-(s.cells[0][0]+s.cells[0][1])*.26).toFixed(2)+"s");el.innerHTML=s.kraken?KRAK:inkShip(L,v,s.isCap);$("fl").appendChild(el);const o={s,el};layShip(o);return o}
function inkShip(L,v,cap){const H=L*100,I="#2b1d12",C="#f4e8c8",hatch=(x0,y0,x1,y1,n)=>{let o="";for(let i=1;i<n;i++){const t=i/n;o+=`<path d="M${x0} ${y0+(y1-y0)*t}H${x1}" stroke="${I}" stroke-width="1" opacity=".45"/>`}return o};
  let g=`<path d="M38 ${H-10}q-14-8-14-30V${H*.5}Q30 ${H*.22} 50 6Q70 ${H*.22} 76 ${H*.5}V${H-40}q0 22-14 30z" fill="${C}" stroke="${I}" stroke-width="3" stroke-linejoin="round"/>`;
  g+=`<path d="M50 14V${H-18}" stroke="${I}" stroke-width="1.2" opacity=".5"/><path d="M30 ${H*.45}Q50 ${H*.3} 70 ${H*.45}" fill="none" stroke="${I}" stroke-width="1.5"/>`;
  g+=hatch(31,H*.5,69,H-22,Math.max(3,L*3));
  g+=`<rect x="34" y="${H-36}" width="32" height="20" rx="3" fill="${C}" stroke="${I}" stroke-width="2.5"/><circle cx="42" cy="${H-26}" r="2.3" fill="${I}"/><circle cx="50" cy="${H-26}" r="2.3" fill="${I}"/><circle cx="58" cy="${H-26}" r="2.3" fill="${I}"/>`;
  for(let i=0;i<L*2;i++){const y=H*.4+i*((H*.55)/(L*2));g+=`<rect x="22" y="${y}" width="6" height="8" rx="1" fill="${I}"/><rect x="72" y="${y}" width="6" height="8" rx="1" fill="${I}"/>`}
  g+=`<path d="M50 ${H*.2}L50 -6" stroke="${I}" stroke-width="2.5"/><path d="M50 -2L30 ${H*.2}Q40 ${H*.14} 50 ${H*.2}z" fill="${C}" stroke="${I}" stroke-width="2"/>`;
  const nM=L===1?1:L===2?2:3,top=H*.22,bot=H-44,span=bot-top;
  for(let i=0;i<nM;i++){const my=top+span*((i+.5)/nM),w1=36,w2=42,sh=28;
    g+=`<path d="M${50-w2} ${my-6}L${50+w2} ${my+6}M${50-w1} ${my+sh-6}L${50+w1} ${my+sh+6}" stroke="${I}" stroke-width="2"/>`;
    g+=`<path d="M${50-w2} ${my-4}Q50 ${my+16} ${50+w2} ${my+4}L${50+w1} ${my+sh+4}Q50 ${my+sh+22} ${50-w1} ${my+sh-4}Z" fill="${cap&&i===nM-1?I:C}" stroke="${I}" stroke-width="2.5" stroke-linejoin="round"/>`;
    g+=`<path d="M${50-w2+6} ${my+2}Q50 ${my+18} ${50+w2-6} ${my+8}" fill="none" stroke="${cap&&i===nM-1?C:I}" stroke-width="1.2" opacity=".6"/>`;
    g+=`<path d="M${50-w2} ${my-4}L24 ${H-22}M${50+w2} ${my+4}L76 ${H-22}" stroke="${I}" stroke-width=".9" opacity=".55"/>`;
    g+=`<circle cx="50" cy="${my}" r="4.5" fill="${I}"/>`;
    if(cap&&i===nM-1)g+=`<circle cx="50" cy="${my+sh*.5+2}" r="6" fill="${C}"/><rect x="46.5" y="${my+sh*.5+6}" width="7" height="4" fill="${C}"/><circle cx="47.5" cy="${my+sh*.5+1}" r="1.5" fill="${I}"/><circle cx="52.5" cy="${my+sh*.5+1}" r="1.5" fill="${I}"/>`}
  g+=`<path d="M50 ${top-8}h18l-5 5 5 5H50z" fill="${cap?"#c6472f":I}"/><path d="M50 ${top-10}V${top-2}" stroke="${I}" stroke-width="2"/>`;
  g+=`<circle cx="50" cy="${H-12}" r="3.5" fill="#c99a3d" stroke="${I}" stroke-width="1.5"/>`;
  g+=`<path d="M18 ${H*.3}q-8 ${H*.2} -2 ${H*.5}M82 ${H*.3}q8 ${H*.2} 2 ${H*.5}" fill="none" stroke="${C}" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>`;
  return `<svg viewBox="0 0 ${v?100:H} ${v?H:100}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">${v?g:`<g transform="translate(0 100) rotate(-90)">${g}</g>`}</svg>`}
const KRAK=`<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"><path d="M60 118C56 50 144 50 140 118Q100 136 60 118Z" fill="#f4e8c8" stroke="#2b1d12" stroke-width="3"/><path d="M72 70q28-22 56 0M68 90q32-14 64 0" fill="none" stroke="#2b1d12" stroke-width="1.5" opacity=".5"/><g fill="none" stroke="#2b1d12" stroke-width="12" stroke-linecap="round"><path d="M66 116C40 128 26 158 50 176"/><path d="M92 122C84 150 70 168 84 186"/><path d="M108 122C116 150 130 168 116 186"/><path d="M134 116C160 128 174 158 150 176"/></g><g fill="#f4e8c8"><circle cx="46" cy="150" r="3"/><circle cx="40" cy="164" r="3"/><circle cx="80" cy="150" r="3"/><circle cx="78" cy="168" r="3"/><circle cx="120" cy="150" r="3"/><circle cx="122" cy="168" r="3"/><circle cx="154" cy="150" r="3"/><circle cx="160" cy="164" r="3"/></g><circle cx="84" cy="96" r="11" fill="#f4e8c8" stroke="#2b1d12" stroke-width="2.5"/><circle cx="116" cy="96" r="11" fill="#f4e8c8" stroke="#2b1d12" stroke-width="2.5"/><circle cx="86" cy="98" r="5" fill="#2b1d12"/><circle cx="118" cy="98" r="5" fill="#2b1d12"/><path d="M90 112q10 8 20 0" fill="none" stroke="#2b1d12" stroke-width="2.5"/></svg>`;
/* abordage + butin */
function TOKSIDE(k){return k==="mine"?`<svg class="mine" viewBox="0 0 100 60"><path d="M8 40h70l-10 14H18z" fill="#2b1d12"/><path d="M8 40h70" stroke="#c99a3d" stroke-width="2.5"/><path d="M44 40V8" stroke="#2b1d12" stroke-width="3"/><path d="M44 10l-22 22h22z" fill="#2b1d12"/><path d="M44 10l22 22H44z" fill="#f4e8c8" stroke="#2b1d12" stroke-width="2"/><path d="M44 8h12l-3 3 3 3H44z" fill="#c6472f"/></svg>`
  :`<svg class="foe" viewBox="0 0 100 60"><path d="M22 40h70l-10 14H32z" fill="#f4e8c8" stroke="#2b1d12" stroke-width="2.5"/><path d="M56 40V8" stroke="#2b1d12" stroke-width="3"/><path d="M56 10l-22 22h22z" fill="#f4e8c8" stroke="#2b1d12" stroke-width="2"/><path d="M56 10l22 22H56z" fill="#2b1d12"/><circle cx="66" cy="24" r="3" fill="#f4e8c8"/><path d="M56 8h12l-3 3 3 3H56z" fill="#2b1d12"/></svg>`}
/* duel capitaine */
const HAND={sabre:{n:"Sabre",ic:IC.sabre,beats:"parrot",how:"Le sabre fait fuir le perroquet"},pistol:{n:"Pistolet",ic:IC.pistol,beats:"sabre",how:"Le pistolet tire avant le sabre"},parrot:{n:"Perroquet",ic:IC.parrot,beats:"pistol",how:"Le perroquet mouille la poudre"}};
function captainDuel(s){const k=cfg.cap,cap=P.caps[k];duel({name:cap[0],style:cap[2],face:k,loot:0,tell:cap[2]==="sabre"?"Il caresse la garde de son sabre.":cap[2]==="pistol"?"Il tapote la crosse de son pistolet.":"Un perroquet hurle sur son épaule."},w=>{
    if(w){P.frags[k]=1;save();sfx.fanfare(true);sheet(`<div class="kick">Fragment de carte</div><div class="big" style="color:var(--red)">${IC.frag}</div><h2>${cap[0]} rend les armes</h2><p>Le fragment ${P.frags.filter(Boolean).length}/3 est à toi.${P.frags.every(Boolean)?" <b>L'Île du Crâne est en vue !</b>":""}</p>`,[["Continuer",()=>{closeSheet();over=false;checkWin()}]])}
    else{sheet(`<div class="kick">Repoussé</div><div class="big">${FACE(k)}</div><h2>${cap[0]} s'enfuit à la nage</h2><p>Il garde son fragment. Tu le recroiseras dans quelques mers.</p>`,[["Continuer",()=>{closeSheet();over=false;checkWin()}]])}})}
function duel(foe,done){const st={me:0,foe:0,round:1,busy:true,last:null};let timer=null,t0=0;
  const draw=(v,mine,theirs)=>{const pips=(n,l)=>[0,1].map(q=>`<i class="${q<n?l:""}"></i>`).join("");
    sheet(`<div class="duel"><div class="kick">Duel · manche ${st.round}</div><h2>${foe.name}</h2><p class="sm">${foe.tell||"Un capitaine illisible."}</p><div class="pips">${pips(st.me,"w")}<span class="vs">toi</span></div><div class="pips">${pips(st.foe,"l")}<span class="vs">lui</span></div>
      <div class="dbar"><i id="dbar"></i></div><div class="arena"><div class="hand me ${mine?"sl":""}" id="hme">${mine?HAND[mine].ic:"?"}</div><span class="vs">VS</span><div class="hand foe ${theirs?"sr":""}" id="hfoe">${theirs?HAND[theirs].ic:"?"}</div></div>
      <div class="verdict ${v?v.cls:""}">${v?v.txt:"Choisis vite !"}</div><div class="picks">${Object.keys(HAND).map(h=>`<button class="pick" data-h="${h}"${st.busy?" disabled":""}>${HAND[h].ic}${HAND[h].n}<small>bat ${HAND[HAND[h].beats].n}</small></button>`).join("")}</div></div>`,[]);
    $("card").querySelectorAll(".pick").forEach(b=>b.onclick=()=>play(b.dataset.h))};
  const foePick=()=>{const ks=Object.keys(HAND);if(foe.style&&Math.random()<.6)return foe.style;let k;do{k=ks[Math.random()*3|0]}while(k===st.last&&Math.random()<.5);return k};
  const arm=()=>{t0=performance.now();clearInterval(timer);timer=setInterval(()=>{const k=Math.max(0,1-(performance.now()-t0)/2200),bar=$("dbar");if(bar)bar.style.transform=`scaleX(${k})`;if(k<=0){clearInterval(timer);play(Object.keys(HAND)[Math.random()*3|0])}},40)};
  const play=mine=>{if(st.busy)return;st.busy=true;clearInterval(timer);const theirs=foePick();st.last=theirs;sfx.cannon();let v;
    if(mine===theirs)v={cls:"",txt:"Égalité ! On remet ça."};else if(HAND[mine].beats===theirs){st.me++;v={cls:"w",txt:HAND[mine].how+" !"}}else{st.foe++;v={cls:"l",txt:HAND[theirs].how+"…"}}
    draw(v,mine,theirs);setTimeout(()=>{const me=$("hme"),fo=$("hfoe");if(!me||!fo)return;if(v.cls==="w"){fo.classList.add("lose");sfx.star(1)}else if(v.cls==="l"){me.classList.add("lose");sfx.lose()}else sfx.click()},380);
    setTimeout(()=>{if(st.me>=2||st.foe>=2)end(st.me>=2);else{st.round++;st.busy=false;draw(null);arm()}},1500)};
  let ended=false;const end=w=>{if(ended)return;ended=true;clearInterval(timer);if(foe.loot){if(w){P.gold+=foe.loot;save();sfx.fanfare(true);sheet(`<div class="kick">Abordage réussi</div><div class="big">${IC.gold}</div><h2>Butin !</h2><p>+${foe.loot} pièces.</p>`,[["Continuer",()=>{closeSheet();hudGold();done(true)}]])}
      else{sfx.lose();sheet(`<div class="kick">Repoussé</div><h2>Ils t'ont jeté à la mer</h2><p>Pas de butin cette fois.</p>`,[["Continuer",()=>{closeSheet();done(false)}]])}}else done(w)};
  draw(null);const v0=$("card").querySelector(".verdict");if(v0)v0.textContent="En garde…";$("card").querySelectorAll(".pick").forEach(b=>b.disabled=true);
  setTimeout(()=>{if(ended)return;st.busy=false;draw(null);arm()},900)}
/* fin de mer */
function checkWin(){if(!ships.every(s=>s.sunk))return;over=true;fuseStop();const nd=curNd;sfx.fanfare();const tres=nd.t==="tresor";const bonus=Math.max(0,spare())*15;P.gold+=bonus;save();hudGold();
  later(()=>{if(tres){const g=200*P.ch;P.gold+=g;P.ch++;P.frags=[0,0,0];P.caps=capsFor(P.ch);P.lvl=0;P.seen.story=0;save();sheet(`<div class="kick">Chapitre ${P.ch-1} terminé</div><div class="big" style="color:var(--red)">${LM.tresor}</div><h2>Le trésor est à toi !</h2><p>+${g} pièces. Au fond du coffre, une nouvelle carte déchirée : trois autres capitaines.</p>`,[["Chapitre suivant",()=>{closeSheet();story()}]])}
    else{const left=P.frags.filter(f=>!f).length;sheet(`<div class="kick">${nd.name}</div><h2>Mer nettoyée</h2><p>Bonus d'équipage : +${bonus} pièces.</p><p class="sm">${left?"Il reste "+left+" fragment"+(left>1?"s":"")+" à prendre aux capitaines."+(P.lvl%3===2?" Le prochain t'attend.":""):"L'Île du Crâne est la prochaine escale."}</p>`,[["Mer suivante",()=>{closeSheet();nextLevel()}]])}},900)}
function wreck(why){over=true;fuseStop();sfx.lose();let k=0;ships.forEach(s=>{(s.pieces||[]).forEach(w=>w.remove());if(s.sunk)return;later(()=>{const o=addShip(s);o.el.style.opacity=".55"},200+(k++)*150)});
  const loss=Math.round(P.gold*.2);P.gold-=loss;save();hudGold();
  later(()=>sheet(`<div class="kick">Naufrage</div><div class="big">${IC.skull}</div><h2>${why?"Soute vide":"Ton navire sombre"}</h2><p>${why||"L'équipage regagne la côte à la nage."} ${loss?"Tu perds "+loss+" pièces dans l'eau.":""}</p>`,[["Réessayer cette mer",()=>exitBoard(()=>startHunt())]]),1300)}
/* objets */
$("spyBtn").onclick=()=>{if(busy()||!P.spy)return;if(!started){say("Sonde d'abord une case.");return}const cand=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]===-1&&state[r][c]==="")cand.push([r,c,count(r,c)]);if(!cand.length)return;
  P.spy--;save();cand.sort((a,b)=>b[2]-a[2]);const[r,c]=cand[Math.random()*Math.min(4,cand.length)|0];sfx.spy();revealAnim(rippleFrom(r,c,revealWater(r,c)),1000/RSPEED);say("La longue-vue repère une eau sûre.","good");hud()};
$("powBtn").onclick=()=>say(P.pow?"La poudre protège ton prochain tir manqué.":"Pas de poudre.");
$("mSonar").onclick=()=>{setMode("sonar");sfx.click()};$("mFire").onclick=()=>{setMode("fire");sfx.swap()};$("mBordee").onclick=()=>{setMode(mode==="bordee"?"fire":"bordee");sfx.fanfare()};
$("mapBtn").onclick=()=>{muted=!muted;store.set("abordage-muted",muted?"1":"0");setIcons();sfx.click()};
/* intros */
const D=(cls,t="")=>`<span class="dw c ${cls}">${t}</span>`;
function tutorial(){sheet(`<div class="kick">Ordre du capitaine</div><h2>Trouve la flotte, aborde-la</h2><div class="steps">
  <div class="step">${D("")}<span>Touche une case pour la <b>sonder</b>. Un chiffre apparaît.</span></div>
  <div class="step">${D("w n2","2")}<span>Il compte les morceaux de navire dans les <b>8 cases autour</b>.</span></div>
  <div class="step">${D("h")}<span>Sûr de toi ? Passe en <b>Feu !</b> et tire au canon. Un navire <b>touché riposte</b> tant qu'il flotte : achève-le vite.</span></div></div>
  <p class="sm">Tu as <b>exactement</b> autant de boulets que de coques à détruire : un seul tir dans l'eau et la flotte est hors de portée. La poudre rattrape un tir manqué. La flotte riposte quand la mèche est consumée ; chaque navire coulé la rallonge. Enchaîne les bons coups pour charger la <b>Bordée</b>.</p>`,[["Larguer les amarres",()=>{P.seen.tuto=1;save();closeSheet()}]])}
const INTRO={cap:["Capitaine en vue","Le plus grand navire de cette mer est le sien. Coule-le, puis bats-le au duel pour lui prendre son fragment de carte."],kraken:["Le Kraken","Un monstre de 2 × 2 cases veille sur l'île. Il se coule comme un navire."]};
function intro(k){sfx.flag();sheet(`<div class="kick">Attention</div><h2>${INTRO[k][0]}</h2><p>${INTRO[k][1]}</p>`,[["Compris",()=>{P.seen[k]=1;save();closeSheet()}]])}
function introBordee(){sfx.fanfare();const g=Array.from({length:25},(_,i)=>{const r=i/5|0,c=i%5;return `<i class="${r===2&&c===2?"t":r===2||c===2?"x":""}"></i>`}).join("");
  sheet(`<div class="kick">Nouveau coup</div><h2>La Bordée</h2><div class="bdg">${g}</div><p>Trois bons coups d'affilée l'ont chargée. Choisis le bouton doré <b>Bordée</b>, puis touche une case : <b>toute sa ligne et toute sa colonne</b> sont canonnées d'un seul boulet. L'eau se dévoile sans rien perdre, chaque coque traversée est touchée.</p><p class="sm">Une erreur ou une riposte vide la charge. Garde-la pour une ligne où tu soupçonnes plusieurs navires.</p>`,[["Compris",()=>{P.seen.bordee=1;save();closeSheet()}]])}
function story(){sfx.show(3);sheet(`<div class="kick">Chapitre ${P.ch}</div><div class="big" style="color:var(--red)">${IC.frag}</div><h2>La carte déchirée</h2><p>La carte du trésor a été déchirée en trois. Trois capitaines en gardent chacun un morceau : <b>${P.caps.map(c=>c[0]).join(", ")}</b>.</p><p class="sm">Mer après mer, coule leurs navires et prends les fragments. L'Île du Crâne se dévoilera.</p>`,[["Prendre la mer",()=>{P.seen.story=1;if(P.lvl<1)P.lvl=1;save();closeSheet();startHunt()}]])}
/* boot */
function setIcons(){$("mapBtn").innerHTML=IC.sound;$("mapBtn").classList.toggle("off",muted);$("mSonar").innerHTML=IC.sonar+"Sonder";$("mFire").innerHTML=IC.fire+'<span id="fireLbl">Feu !</span><span class="furie"><i id="furieBar"></i></span>';$("mBordee").innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h18M12 3v18"/><circle cx="12" cy="12" r="3.5"/></svg>Bordée'}
document.addEventListener("pointerdown",()=>{A()},{once:true});
setIcons();if(!P.caps){P.caps=capsFor(P.ch);save()}$("sHunt").hidden=false;
if(!P.seen.story)setTimeout(story,250);else startHunt();
</script>
